<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Reality Engine</title>
    <meta name="description" content="Paste a meeting transcript and extract decisions, commitments, and conflicts instantly.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0A0A0C;
            --surface: #131316;
            --surface-hover: #18181C;
            --surface-raised: #1C1C21;
            --border: #232326;
            --border-subtle: #1A1A1D;
            --border-hover: #2E2E32;
            --text-primary: #F2F2F3;
            --text-secondary: #8B8B90;
            --text-tertiary: #55555A;
            --status-decided: #34D399;
            --status-committed: #60A5FA;
            --status-discussed: #FBBF24;
            --status-conflict: #F87171;
            --status-unknown: #9CA3AF;
            --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 20px;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --duration: 180ms;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
            --shadow-md: 0 4px 16px -4px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.3);
            --shadow-lg: 0 16px 40px -12px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.35);
        }

        *, *::before, *::after { box-sizing: border-box; }

        ::selection {
            background: rgba(96, 165, 250, 0.25);
            color: var(--text-primary);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-ui);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem 1.5rem;
        }

        /* ── Sections ── */
        .section { width: 100%; max-width: 560px; }
        .section-wide { width: 100%; max-width: none; }
        .hidden { display: none !important; }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Input section ── */
        #input-section { animation: fade-up 0.6s var(--ease-out) both; }

        #input-section h1 {
            font-size: 1.75rem; font-weight: 600; margin: 0 0 2.5rem;
            text-align: center; letter-spacing: -0.025em; line-height: 1.25;
        }

        .field-group { margin-bottom: 1.25rem; }
        .field-group:last-of-type { margin-bottom: 0; }

        label {
            display: block; font-size: 0.75rem; font-weight: 500;
            color: var(--text-secondary); margin-bottom: 0.5rem; letter-spacing: 0.01em;
        }
        label .hint { color: var(--text-tertiary); font-weight: 400; }

        .toolbar-btn {
            font-family: var(--font-ui); font-size: 0.6875rem; font-weight: 500;
            color: var(--text-secondary); background: none;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 0.25rem 0.625rem; cursor: pointer;
            transition: background var(--duration) var(--ease-out),
                        color var(--duration) var(--ease-out),
                        border-color var(--duration) var(--ease-out);
        }
        .toolbar-btn:hover {
            background: var(--surface); color: var(--text-primary);
            border-color: var(--border-hover);
        }

        textarea, input[type="text"] {
            width: 100%; background: var(--surface); color: var(--text-primary);
            border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 0.75rem 0.875rem; font-size: 0.875rem;
            font-family: var(--font-ui); line-height: 1.5; outline: none;
            transition: border-color var(--duration) var(--ease-out),
                        background-color var(--duration) var(--ease-out),
                        box-shadow var(--duration) var(--ease-out);
            caret-color: var(--status-committed);
        }
        textarea:hover, input[type="text"]:hover {
            border-color: var(--border-hover); background: var(--surface-hover);
        }
        textarea:focus, input[type="text"]:focus {
            border-color: rgba(96,165,250,0.5); background: var(--surface);
            box-shadow: 0 0 0 3px rgba(96,165,250,0.08);
        }
        textarea::placeholder, input[type="text"]::placeholder { color: var(--text-tertiary); }

        #transcript {
            font-family: var(--font-mono); font-size: 0.8125rem;
            line-height: 1.7; min-height: 200px; resize: vertical;
        }

        .optional-row {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 0.75rem; margin-top: 1.25rem;
        }

        /* ── Analyze button ── */
        #analyze-btn, #speaker-continue-btn {
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            width: 100%; margin-top: 1.75rem; padding: 0.6875rem 1.25rem;
            font-family: var(--font-ui); font-size: 0.875rem; font-weight: 500;
            letter-spacing: -0.005em; color: var(--bg); background: var(--text-primary);
            border: none; border-radius: var(--radius-md); cursor: pointer;
            transition: opacity var(--duration) var(--ease-out), transform 80ms var(--ease-out);
        }
        #analyze-btn:hover:not(:disabled), #speaker-continue-btn:hover:not(:disabled) { opacity: 0.88; }
        #analyze-btn:active:not(:disabled), #speaker-continue-btn:active:not(:disabled) { transform: scale(0.98); }
        #analyze-btn:disabled, #speaker-continue-btn:disabled { opacity: 0.25; cursor: not-allowed; }
        #analyze-btn:focus-visible, #speaker-continue-btn:focus-visible { outline: 2px solid var(--status-committed); outline-offset: 2px; }
        #analyze-btn .btn-icon, #speaker-continue-btn .btn-icon { display: flex; transition: transform var(--duration) var(--ease-out); }
        #analyze-btn:hover:not(:disabled) .btn-icon, #speaker-continue-btn:hover:not(:disabled) .btn-icon { transform: translateX(2px); }

        /* ── Mode switch (transcript / upload) ── */
        .mode-switch {
            display: inline-flex; gap: 0.25rem; padding: 0.1875rem;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-md); margin-bottom: 1.5rem;
        }
        .mode-tab {
            padding: 0.375rem 0.75rem; font-family: var(--font-ui);
            font-size: 0.75rem; font-weight: 500; color: var(--text-secondary);
            background: none; border: none; border-radius: calc(var(--radius-md) - 3px);
            cursor: pointer; transition: background var(--duration) var(--ease-out),
                        color var(--duration) var(--ease-out);
        }
        .mode-tab:hover { color: var(--text-primary); }
        .mode-tab.active { background: var(--surface-hover); color: var(--text-primary); }

        /* ── Dropzone ── */
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
        }
        .dropzone {
            position: relative; display: flex; align-items: center; justify-content: center;
            min-height: 120px; padding: 1.5rem; text-align: center;
            border: 1px dashed var(--border-hover); border-radius: var(--radius-md);
            background: var(--surface); cursor: pointer;
            transition: border-color var(--duration) var(--ease-out),
                        background-color var(--duration) var(--ease-out);
        }
        .dropzone:hover, .dropzone.dragover {
            border-color: var(--status-committed); background: var(--surface-hover);
        }
        .dropzone.has-file { border-style: solid; }
        #dropzone-label {
            font-size: 0.8125rem; color: var(--text-secondary); word-break: break-word;
        }
        .dropzone.has-file #dropzone-label { color: var(--text-primary); font-family: var(--font-mono); }

        /* ── Speaker naming ── */
        .speaker-intro {
            font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 1.5rem;
        }
        .speaker-intro span { color: var(--text-primary); font-weight: 500; }
        .speaker-list { display: flex; flex-direction: column; gap: 0.625rem; }
        .speaker-item {
            display: flex; align-items: center; gap: 0.625rem;
            padding: 0.75rem; background: var(--surface);
            border: 1px solid var(--border); border-radius: var(--radius-md);
        }
        .speaker-play-btn {
            flex-shrink: 0; width: 32px; height: 32px; display: flex;
            align-items: center; justify-content: center;
            background: var(--surface-hover); border: 1px solid var(--border);
            border-radius: 50%; color: var(--text-primary); cursor: pointer;
            transition: border-color var(--duration) var(--ease-out);
        }
        .speaker-play-btn:hover { border-color: var(--status-committed); }
        .speaker-play-btn.playing { color: var(--status-committed); border-color: var(--status-committed); }
        .speaker-name-input {
            flex: 1; background: var(--bg); color: var(--text-primary);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 0.5rem 0.625rem; font-size: 0.8125rem; font-family: var(--font-ui);
            outline: none; transition: border-color var(--duration) var(--ease-out);
        }
        .speaker-name-input:focus { border-color: rgba(96,165,250,0.5); }
        .speaker-original-label {
            flex-shrink: 0; font-family: var(--font-mono); font-size: 0.6875rem;
            color: var(--text-tertiary); width: 4.5rem;
        }

        .kbd-hint {
            display: none; font-size: 0.6875rem; font-weight: 400;
            color: var(--text-tertiary); background: rgba(255,255,255,0.06);
            padding: 0.125rem 0.375rem; border-radius: 4px; margin-left: 0.25rem;
        }
        @media (hover: hover) and (pointer: fine) { .kbd-hint { display: inline-block; } }

        /* ── Loading section ── */
        #loading-section {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 50vh;
            animation: fade-up 0.5s var(--ease-out) both;
        }

        .progress-track {
            width: 200px; height: 1px; background: var(--border);
            border-radius: 1px; overflow: hidden; margin-bottom: 2.5rem;
        }
        .progress-fill {
            width: 40%; height: 100%; background: var(--text-secondary);
            border-radius: 1px; animation: indeterminate 1.6s ease-in-out infinite;
        }
        @keyframes indeterminate {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }

        .status-line { position: relative; height: 1.25rem; margin-bottom: 1rem; }
        .status-text {
            font-family: var(--font-mono); font-size: 0.75rem;
            color: var(--text-secondary); letter-spacing: 0.01em;
            transition: opacity 0.3s ease, transform 0.3s ease;
            position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap;
        }
        .status-text.out { opacity: 0; transform: translateX(-50%) translateY(-4px); }
        .status-text.in  { opacity: 1; transform: translateX(-50%) translateY(0); }

        .counter-line {
            font-family: var(--font-mono); font-size: 0.6875rem;
            color: var(--text-tertiary); letter-spacing: 0.02em; min-height: 1rem;
        }

        .retry-btn {
            margin-top: 1.5rem; padding: 0.5rem 1.125rem;
            font-family: var(--font-ui); font-size: 0.8125rem; font-weight: 500;
            color: var(--text-primary); background: var(--surface);
            border: 1px solid var(--border); border-radius: var(--radius-md);
            cursor: pointer; transition: background var(--duration) var(--ease-out),
                        border-color var(--duration) var(--ease-out);
        }
        .retry-btn:hover { background: var(--surface-hover); border-color: var(--border-hover); }

        /* ── Results section ── */
        #results-section {
            animation: fade-up 0.5s var(--ease-out) both;
            padding: 0 2rem;
        }

        .stat-row {
            display: flex; align-items: center; justify-content: center;
            gap: 0.5rem; flex-wrap: wrap; margin-bottom: 2.25rem;
        }
        .stat-row .stat-item {
            display: flex; align-items: center; gap: 0.4375rem;
            font-family: var(--font-ui); font-size: 0.75rem; font-weight: 500;
            color: var(--text-secondary); letter-spacing: -0.005em;
            background: var(--surface); border: 1px solid var(--border-subtle);
            border-radius: 999px; padding: 0.3125rem 0.75rem 0.3125rem 0.625rem;
        }
        .stat-row .stat-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
        .stat-row .stat-item strong { color: var(--text-primary); font-weight: 600; }
        .stat-row .stat-sep { display: none; }

        .results-toolbar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 1rem; margin: -1.5rem 0 1.75rem; flex-wrap: wrap;
        }

        .result-tabs {
            position: relative; display: inline-flex; gap: 0; padding: 0.1875rem;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-md);
        }
        .result-tab {
            position: relative; z-index: 1;
            padding: 0.375rem 0.875rem; font-family: var(--font-ui);
            font-size: 0.75rem; font-weight: 500; color: var(--text-secondary);
            background: none; border: none; border-radius: calc(var(--radius-md) - 3px);
            cursor: pointer; transition: color var(--duration) var(--ease-out);
        }
        .result-tab:hover { color: var(--text-primary); }
        .result-tab.active { color: var(--text-primary); }
        .result-tab:focus-visible { outline: 2px solid var(--status-committed); outline-offset: 2px; }

        .result-tab-indicator {
            position: absolute; top: 0.1875rem; bottom: 0.1875rem;
            left: 0.1875rem; right: 0.1875rem;
            border-radius: calc(var(--radius-md) - 3px);
            background: var(--surface-raised); box-shadow: var(--shadow-sm);
            clip-path: inset(0 100% 0 0 round calc(var(--radius-md) - 3px));
            transition: clip-path 320ms var(--ease-spring);
            pointer-events: none;
        }

        /* ── Recap tab — a quiet, readable feed; the timeline rail is the one
           structural motif borrowed across every output view ── */
        .recap-panel { max-width: 680px; margin: 0 auto; }

        .recap-overview {
            font-size: 1.125rem; font-weight: 450; line-height: 1.7;
            letter-spacing: -0.006em;
            color: var(--text-primary); margin: 0 0 2.5rem;
        }

        .recap-beats { list-style: none; margin: 0; padding: 0; position: relative; }
        .recap-beats::before {
            content: ''; position: absolute; left: 3px; top: 0.9rem; bottom: 1.4rem;
            width: 1px; background: linear-gradient(var(--border), var(--border) 85%, transparent);
        }

        .recap-beat {
            position: relative; border-radius: var(--radius-md);
            padding: 0.6875rem 0.75rem 0.6875rem 1.625rem;
            margin: 0 -0.75rem 0.125rem; cursor: pointer;
            transition: background var(--duration) var(--ease-out);
        }
        .recap-beat:last-child { margin-bottom: 0; }
        .recap-beat:hover { background: var(--surface); }

        .recap-beat-dot {
            position: absolute; left: 0.75rem; top: 1.05rem;
            width: 7px; height: 7px; border-radius: 50%;
            box-shadow: 0 0 0 3px var(--bg); flex-shrink: 0;
        }
        .recap-beat-header { display: flex; align-items: flex-start; gap: 0.5rem; }
        .recap-beat-text {
            flex: 1; font-size: 0.875rem; line-height: 1.65; color: var(--text-primary);
        }
        .recap-beat-chevron {
            flex-shrink: 0; margin-top: 0.2rem; color: var(--text-tertiary); opacity: 0;
            transition: transform 220ms var(--ease-out), opacity var(--duration) var(--ease-out);
        }
        .recap-beat:hover .recap-beat-chevron { opacity: 1; }
        .recap-beat.expanded .recap-beat-chevron { opacity: 1; transform: rotate(90deg); }

        .recap-beat-evidence {
            display: none; margin-top: 0.75rem;
            animation: fade-up 0.25s var(--ease-out) both;
        }
        .recap-beat.expanded .recap-beat-evidence { display: block; }

        .recap-empty {
            font-size: 0.8125rem; color: var(--text-secondary); line-height: 1.6;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 1rem 1.25rem;
        }

        /* ── Mindmap tab — radial layout of the same meeting_state data.
           HTML pill nodes over an SVG line layer, positioned by percentage
           so the whole composition scales without any resize recalculation;
           deliberately shares the node-card interaction language from the
           Timeline tab (same hover lift, same corner wash) so the two views
           read as one system, not two different UI kits. ── */
        .mindmap-panel { display: flex; justify-content: center; padding: 1rem 0 2rem; }
        .mindmap-canvas {
            position: relative; width: 100%; max-width: 680px; aspect-ratio: 1 / 1;
        }
        .mindmap-lines {
            position: absolute; inset: 0; width: 100%; height: 100%;
            overflow: visible; pointer-events: none;
        }
        .mindmap-spoke {
            fill: none; stroke: var(--border-subtle); stroke-width: 1;
            vector-effect: non-scaling-stroke;
        }
        .mindmap-dep-line {
            fill: none; stroke: var(--border-hover); stroke-width: 1.25;
            stroke-dasharray: 1 4; stroke-linecap: round;
            vector-effect: non-scaling-stroke;
        }

        .mindmap-center {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            display: flex; align-items: center; justify-content: center;
            width: 15%; aspect-ratio: 1 / 1; min-width: 76px; border-radius: 50%;
            background: var(--surface-raised); border: 1px solid var(--border-hover);
            box-shadow: var(--shadow-md);
            font-family: var(--font-ui); font-size: 0.8125rem; font-weight: 600;
            color: var(--text-primary); text-align: center; padding: 0.5rem;
        }

        .mindmap-node {
            position: absolute; transform: translate(-50%, -50%);
            width: 148px; max-width: 34%;
            background: var(--surface); background-repeat: no-repeat;
            background-position: top right; background-size: 90px 60px;
            border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 0.625rem 0.75rem; cursor: pointer; text-align: left;
            box-shadow: var(--shadow-sm);
            transition: border-color var(--duration) var(--ease-out),
                        box-shadow 220ms var(--ease-out),
                        background-color var(--duration) var(--ease-out),
                        transform 220ms var(--ease-out);
        }
        .mindmap-node:hover, .mindmap-node:focus-visible {
            background-color: var(--surface-raised); border-color: var(--border-hover);
            box-shadow: var(--shadow-md); z-index: 2;
            transform: translate(-50%, -50%) translateY(-3px);
        }
        .mindmap-node:focus-visible { outline: 2px solid var(--status-committed); outline-offset: 2px; }

        .mindmap-node[data-status="DECIDED"]   { background-image: radial-gradient(circle at 100% 0%, rgba(52,211,153,0.14), transparent 70%); }
        .mindmap-node[data-status="COMMITTED"] { background-image: radial-gradient(circle at 100% 0%, rgba(96,165,250,0.14), transparent 70%); }
        .mindmap-node[data-status="DISCUSSED"] { background-image: radial-gradient(circle at 100% 0%, rgba(251,191,36,0.14), transparent 70%); }
        .mindmap-node[data-status="CONFLICT"]  { background-image: radial-gradient(circle at 100% 0%, rgba(248,113,113,0.18), transparent 70%); border-color: rgba(248,113,113,0.28); }
        .mindmap-node[data-status="UNKNOWN"]   { background-image: radial-gradient(circle at 100% 0%, rgba(156,163,175,0.1), transparent 70%); }

        .mindmap-node-status-row { display: flex; align-items: center; gap: 0.375rem; margin-bottom: 0.3125rem; }
        .mindmap-node-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
        .mindmap-node-status-row span {
            font-size: 0.5625rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .mindmap-node-topic {
            font-size: 0.75rem; font-weight: 600; line-height: 1.4; color: var(--text-primary);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        @media (max-width: 480px) {
            .mindmap-node { width: 124px; padding: 0.5rem 0.625rem; }
            .mindmap-node-topic { font-size: 0.6875rem; }
            .mindmap-center { font-size: 0.6875rem; min-width: 60px; }
        }

        .results-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 1.75rem;
            align-items: start;
        }

        .graph-container {
            position: relative; overflow-x: auto; overflow-y: visible;
            padding-bottom: 1.5rem; min-width: 0;
        }
        .graph-viewport {
            position: relative; min-height: 180px;
        }
        .graph-viewport svg {
            position: absolute; top: 0; left: 0;
            pointer-events: none; overflow: visible;
        }

        /* ── Action board ── */
        .action-board { margin-top: 2rem; }
        .action-board-title {
            font-size: 0.625rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--text-tertiary); margin-bottom: 0.875rem;
            padding-bottom: 0.625rem;
            border-bottom: 1px solid var(--border-subtle);
        }
        .action-board-row {
            display: flex; gap: 0.75rem; overflow-x: auto; padding-bottom: 0.25rem;
        }
        .action-card {
            position: relative; flex: 0 0 auto; width: 224px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 0.875rem;
            box-shadow: var(--shadow-sm);
            transition: border-color var(--duration) var(--ease-out),
                        box-shadow 220ms var(--ease-out), transform 220ms var(--ease-out);
        }
        .action-card:hover {
            border-color: var(--border-hover); box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .action-card-top {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 0.625rem;
        }
        .action-owner {
            display: flex; align-items: center; gap: 0.5rem;
            font-size: 0.75rem; font-weight: 600; color: var(--text-primary);
        }
        .action-owner-avatar {
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
            background: var(--surface-raised); border: 1px solid var(--border);
            font-family: var(--font-ui); font-size: 0.5625rem; font-weight: 700;
            color: var(--text-secondary); letter-spacing: 0;
        }
        .action-task {
            font-size: 0.75rem; color: var(--text-secondary); line-height: 1.5;
            margin-bottom: 0.75rem;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .action-deadline {
            display: flex; align-items: center; gap: 0.3125rem;
            font-family: var(--font-mono); font-size: 0.6875rem;
            color: var(--text-tertiary);
        }
        .action-deadline svg { flex-shrink: 0; opacity: 0.7; }
        .action-deadline.no-deadline {
            color: var(--status-discussed); opacity: 0.85; font-style: italic;
            font-family: var(--font-ui);
        }
        .action-confidence {
            display: inline-flex; align-items: center;
            font-size: 0.5625rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.04em;
            padding: 0.1875rem 0.5rem; border-radius: 999px;
        }
        .action-confidence.tentative {
            color: var(--status-discussed);
            background: rgba(251, 191, 36, 0.12);
        }
        .action-confidence.firm {
            color: var(--status-committed);
            background: rgba(96, 165, 250, 0.14);
        }
        .action-board-empty {
            font-size: 0.75rem; color: var(--text-tertiary);
        }

        /* ── Insights sidebar ── */
        .insights-sidebar {
            position: sticky; top: 2rem;
            display: flex; flex-direction: column; gap: 1.75rem;
            max-height: calc(100vh - 4rem); overflow-y: auto;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 1.25rem;
            box-shadow: var(--shadow-sm);
        }

        .insight-group {}

        .insight-group-title {
            font-size: 0.625rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--text-tertiary); margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .insight-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.375rem; }

        .insight-item {
            padding: 0.5625rem 0.625rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background var(--duration) var(--ease-out);
        }
        .insight-item:hover { background: var(--surface-raised); }
        .insight-item:focus-visible { outline: 2px solid var(--status-committed); outline-offset: 1px; }

        .insight-item-header {
            display: flex; align-items: center; gap: 0.4375rem;
        }
        .insight-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
        .insight-topic {
            font-size: 0.75rem; font-weight: 600;
            color: var(--text-primary); line-height: 1.4;
        }
        .insight-desc {
            font-size: 0.6875rem; color: var(--text-tertiary);
            line-height: 1.5; margin-top: 0.25rem;
            padding-left: calc(5px + 0.4375rem);
        }

        /* Risk items — Notion-style callout: a quiet tinted card, no left rule */
        .risk-item {
            cursor: default;
            background: var(--bg); border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md); padding: 0.75rem 0.8125rem;
        }
        .risk-item:hover { background: var(--bg); }
        .risk-header {
            display: flex; align-items: center; gap: 0.375rem;
            margin-bottom: 0.5rem;
        }
        .risk-header svg { color: var(--status-discussed); flex-shrink: 0; }
        .risk-header span {
            font-size: 0.625rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--status-discussed);
        }
        .risk-statement {
            font-size: 0.75rem; color: var(--text-primary);
            line-height: 1.55; margin-bottom: 0.625rem;
        }
        .risk-reason {
            font-size: 0.6875rem; color: var(--text-tertiary);
            line-height: 1.5; margin-bottom: 0.625rem;
        }
        .risk-followup {
            display: flex; gap: 0.4375rem; align-items: flex-start;
            padding-top: 0.625rem; border-top: 1px solid var(--border-subtle);
            font-size: 0.6875rem; color: var(--text-secondary); line-height: 1.5;
        }
        .risk-followup svg { flex-shrink: 0; margin-top: 0.15rem; color: var(--text-tertiary); }

        .insight-no-match {
            font-size: 0.625rem; color: var(--text-tertiary);
            font-style: italic; padding-left: calc(5px + 0.4375rem);
            margin-top: 0.1875rem;
        }

        /* Positive empty states */
        .insight-empty {
            display: flex; align-items: center; gap: 0.5rem;
            font-size: 0.75rem; color: var(--status-decided);
            line-height: 1.5; padding: 0.25rem;
        }
        .graph-empty-note {
            display: inline-flex; align-items: center; gap: 0.5rem;
            font-size: 0.75rem; color: var(--status-decided);
            background: rgba(52,211,153,0.08); border: 1px solid rgba(52,211,153,0.18);
            border-radius: var(--radius-md); padding: 0.5rem 0.75rem;
            margin-bottom: 1rem;
        }
        .graph-empty-note svg { flex-shrink: 0; }

        /* Highlight flash on node card */
        @keyframes card-flash {
            0%   { box-shadow: 0 0 0 2px rgba(156,163,175,0.5); }
            100% { box-shadow: 0 0 0 2px transparent; }
        }
        .node-card.flash {
            animation: card-flash 1.2s var(--ease-out) both;
        }

        /* Staggered node entrance */
        @keyframes node-fade-in {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .node-card.appear {
            animation: node-fade-in 0.35s var(--ease-out) both;
        }

        /* Node cards — status reads through a soft corner wash + badge, never
           a colored stripe on the edge. */
        .node-card {
            position: absolute; width: 184px; background: var(--surface);
            background-repeat: no-repeat; background-position: top right;
            background-size: 100px 72px;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 0.875rem 0.9375rem;
            cursor: pointer; user-select: none;
            box-shadow: var(--shadow-sm);
            transition: border-color var(--duration) var(--ease-out),
                        box-shadow 220ms var(--ease-out),
                        background-color var(--duration) var(--ease-out),
                        transform 220ms var(--ease-out);
        }
        .node-card:hover {
            background-color: var(--surface-raised); border-color: var(--border-hover);
            box-shadow: var(--shadow-md); transform: translateY(-2px);
        }
        .node-card.active { background-color: var(--surface-raised); border-color: var(--border-hover); }
        .node-card:focus-visible { outline: 2px solid var(--status-committed); outline-offset: 2px; }

        .node-card[data-status="DECIDED"]   { background-image: radial-gradient(circle at 100% 0%, rgba(52,211,153,0.14), transparent 70%); }
        .node-card[data-status="COMMITTED"] { background-image: radial-gradient(circle at 100% 0%, rgba(96,165,250,0.14), transparent 70%); }
        .node-card[data-status="DISCUSSED"] { background-image: radial-gradient(circle at 100% 0%, rgba(251,191,36,0.14), transparent 70%); }
        .node-card[data-status="CONFLICT"]  { background-image: radial-gradient(circle at 100% 0%, rgba(248,113,113,0.18), transparent 70%); }
        .node-card[data-status="UNKNOWN"]   { background-image: radial-gradient(circle at 100% 0%, rgba(156,163,175,0.1), transparent 70%); }

        .node-card[data-status="CONFLICT"] {
            border-color: rgba(248,113,113,0.28);
        }
        .node-card[data-status="CONFLICT"]:hover {
            border-color: rgba(248,113,113,0.45);
            box-shadow: var(--shadow-md), 0 0 0 1px rgba(248,113,113,0.2);
        }

        .node-topic {
            font-size: 0.8125rem; font-weight: 600; line-height: 1.4;
            margin-bottom: 0.5rem; letter-spacing: -0.008em;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .node-status {
            display: inline-flex; align-items: center; gap: 0.3125rem;
            font-size: 0.625rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.375rem;
        }
        .node-status-dot { width: 5px; height: 5px; border-radius: 50%; }
        .node-meta {
            font-size: 0.6875rem; color: var(--text-tertiary); line-height: 1.45;
            margin-top: 0.375rem;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }

        .dep-line {
            fill: none; stroke: var(--border-hover); stroke-width: 1.25;
            stroke-dasharray: 1 4; stroke-linecap: round;
            pointer-events: stroke; cursor: help;
            transition: stroke var(--duration) var(--ease-out);
        }
        .dep-line:hover { stroke: var(--status-committed); stroke-width: 1.5; }

        /* ── Side panel ── */
        .side-panel-overlay {
            position: fixed; inset: 0; background: rgba(6,6,8,0.55);
            backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
            z-index: 90; opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .side-panel-overlay.open { opacity: 1; pointer-events: auto; }

        .side-panel {
            position: fixed; top: 0; right: 0; width: 420px; max-width: 90vw;
            height: 100vh; background: var(--surface);
            border-left: 1px solid var(--border); z-index: 100;
            box-shadow: var(--shadow-lg);
            transform: translateX(100%); transition: transform 0.35s var(--ease-out);
            overflow-y: auto; display: flex; flex-direction: column;
        }
        .side-panel.open { transform: translateX(0); }

        .panel-header {
            position: sticky; top: 0; z-index: 1;
            display: flex; align-items: flex-start; justify-content: space-between;
            gap: 0.75rem; padding: 1.5rem 1.5rem 1.25rem;
            background: var(--surface); border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }
        .panel-title { font-size: 1.125rem; font-weight: 600; line-height: 1.35; letter-spacing: -0.017em; }
        .panel-close {
            flex-shrink: 0; width: 30px; height: 30px; margin-top: 0.125rem;
            display: flex; align-items: center; justify-content: center;
            background: none; border: 1px solid var(--border);
            border-radius: 50%; color: var(--text-secondary);
            cursor: pointer; transition: background var(--duration) var(--ease-out),
                        border-color var(--duration) var(--ease-out), color var(--duration) var(--ease-out);
        }
        .panel-close:hover { background: var(--surface-hover); border-color: var(--border-hover); color: var(--text-primary); }
        .panel-close:focus-visible { outline: 2px solid var(--status-committed); outline-offset: 2px; }

        .panel-body { padding: 1.5rem; flex: 1; }
        .panel-section { margin-bottom: 1.5rem; }
        .panel-section:last-child { margin-bottom: 0; }
        .panel-section-label {
            font-size: 0.6875rem; font-weight: 600; color: var(--text-tertiary);
            text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.625rem;
        }
        .panel-reasoning { font-size: 0.8125rem; color: var(--text-secondary); line-height: 1.65; }
        .panel-meta-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .panel-meta-item {
            font-size: 0.75rem; color: var(--text-secondary);
            background: var(--bg); border: 1px solid var(--border-subtle);
            border-radius: 999px; padding: 0.25rem 0.625rem;
        }
        .panel-meta-item strong { color: var(--text-primary); font-weight: 600; }

        .evidence-block {
            position: relative; background: var(--bg); border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md); padding: 0.75rem 0.8125rem;
            margin-bottom: 0.5rem; font-family: var(--font-mono);
            font-size: 0.75rem; line-height: 1.65; color: var(--text-secondary);
        }
        .evidence-block:last-child { margin-bottom: 0; }
        .evidence-speaker { color: var(--text-primary); font-weight: 600; margin-right: 0.25rem; }
        .evidence-id {
            float: right; margin-left: 0.5rem;
            color: var(--text-tertiary); font-size: 0.625rem; opacity: 0.7;
        }

        .conflict-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 0.625rem; }
        .conflict-side {
            background: var(--bg); border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md); padding: 0.75rem 0.8125rem;
        }
        .conflict-side-label {
            display: flex; align-items: center; gap: 0.3125rem;
            font-size: 0.625rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--status-conflict); margin-bottom: 0.5rem;
        }
        .conflict-side-label::before {
            content: ''; width: 5px; height: 5px; border-radius: 50%;
            background: var(--status-conflict);
        }
        .conflict-side-text { font-size: 0.75rem; color: var(--text-secondary); line-height: 1.55; }

        /* ── Focus rings ── */
        textarea:focus-visible, input[type="text"]:focus-visible {
            outline: 2px solid var(--status-committed); outline-offset: 1px;
        }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .results-layout {
                grid-template-columns: 1fr;
            }
            .insights-sidebar {
                position: static; max-height: none;
                flex-direction: row; flex-wrap: wrap;
            }
            .insight-group { flex: 1; min-width: 240px; }
        }
        @media (max-width: 480px) {
            body { padding: 1.5rem 1rem; }
            #input-section h1 { font-size: 1.5rem; margin-bottom: 2rem; }
            .optional-row { grid-template-columns: 1fr; gap: 1rem; }
            .side-panel { width: 100vw; max-width: 100vw; }
        }
    </style>
</head>
<body>

    <!-- ── Input Section ── -->
    <div id="input-section" class="section">
        <h1>Drop your meeting here.</h1>

        <div class="mode-switch" role="tablist">
            <button type="button" id="mode-transcript-btn" class="mode-tab active" role="tab" aria-selected="true">Paste transcript</button>
            <button type="button" id="mode-upload-btn" class="mode-tab" role="tab" aria-selected="false">Upload recording</button>
        </div>

        <div id="mode-transcript-panel">
            <div class="field-group">
                <label for="transcript">Transcript</label>
                <textarea
                    id="transcript"
                    placeholder="Alice: I think we should ship v2 next Monday.&#10;Bob: Agreed — let's lock the scope today.&#10;Carol: What about the billing migration?"
                    spellcheck="false"
                ></textarea>
            </div>
        </div>

        <div id="mode-upload-panel" class="hidden">
            <div class="field-group">
                <label for="media-input">Recording <span class="hint">(mp4, m4a, mp3, wav…)</span></label>
                <div id="dropzone" class="dropzone">
                    <input type="file" id="media-input" accept="video/*,audio/*" class="sr-only" />
                    <span id="dropzone-label">Drop a file here, or click to browse</span>
                </div>
            </div>
        </div>

        <div class="optional-row">
            <div class="field-group">
                <label for="title">Title <span class="hint">(optional)</span></label>
                <input type="text" id="title" placeholder="Sprint Planning">
            </div>
            <div class="field-group">
                <label for="participants">Participants <span class="hint">(optional)</span></label>
                <input type="text" id="participants" placeholder="Alice, Bob, Carol">
            </div>
        </div>

        <button id="analyze-btn" disabled>
            <span id="analyze-btn-label">Analyze</span>
            <span class="btn-icon">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3.5 8H12.5M9 4.5L12.5 8L9 11.5"/>
                </svg>
            </span>
            <span class="kbd-hint">⌘↵</span>
        </button>
    </div>

    <!-- ── Speaker Naming Section ── -->
    <div id="speaker-section" class="section hidden">
        <h1>Who's who?</h1>
        <p class="speaker-intro">We detected <span id="speaker-count">0</span> speakers. Play a sample and give each one a real name.</p>
        <div id="speaker-list" class="speaker-list"></div>
        <button id="speaker-continue-btn" type="button">
            <span>Continue to analysis</span>
            <span class="btn-icon">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3.5 8H12.5M9 4.5L12.5 8L9 11.5"/>
                </svg>
            </span>
        </button>
    </div>

    <!-- ── Loading Section ── -->
    <div id="loading-section" class="section hidden">
        <div class="progress-track"><div class="progress-fill"></div></div>
        <div class="status-line">
            <span id="status-text" class="status-text in"></span>
        </div>
        <div id="counter-line" class="counter-line"></div>
        <button id="retry-btn" type="button" class="retry-btn hidden">Back to editing</button>
    </div>

    <!-- ── Results Section ── -->
    <div id="results-section" class="section-wide hidden">
        <div id="stat-row" class="stat-row"></div>

        <div class="results-toolbar">
            <div class="result-tabs" role="tablist">
                <div id="result-tab-indicator" class="result-tab-indicator"></div>
                <button type="button" id="tab-recap-btn" class="result-tab active" role="tab" aria-selected="true">Recap</button>
                <button type="button" id="tab-timeline-btn" class="result-tab" role="tab" aria-selected="false">Timeline</button>
                <button type="button" id="tab-mindmap-btn" class="result-tab" role="tab" aria-selected="false">Mindmap</button>
            </div>
            <button type="button" id="copy-summary-btn" class="toolbar-btn">Copy summary</button>
        </div>

        <div id="recap-panel" class="recap-panel"></div>

        <div id="timeline-panel" class="results-layout hidden">
            <div class="graph-container">
                <div id="graph-empty-note" class="graph-empty-note hidden"></div>
                <div id="graph-viewport" class="graph-viewport"></div>
                <div id="action-board" class="action-board"></div>
            </div>
            <aside id="insights-sidebar" class="insights-sidebar"></aside>
        </div>

        <div id="mindmap-panel" class="mindmap-panel hidden">
            <div id="mindmap-canvas" class="mindmap-canvas">
                <svg id="mindmap-svg" class="mindmap-lines" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
            </div>
        </div>
    </div>

    <!-- ── Side Panel ── -->
    <div id="panel-overlay" class="side-panel-overlay"></div>
    <div id="side-panel" class="side-panel">
        <div class="panel-header">
            <span id="panel-title" class="panel-title"></span>
            <button id="panel-close" class="panel-close" aria-label="Close panel">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <path d="M4 4L12 12M12 4L4 12"/>
                </svg>
            </button>
        </div>
        <div id="panel-body" class="panel-body"></div>
    </div>

    <script>
        const transcript = document.getElementById('transcript');
        const titleInput = document.getElementById('title');
        const participantsInput = document.getElementById('participants');
        const analyzeBtn = document.getElementById('analyze-btn');
        const inputSection = document.getElementById('input-section');
        const loadingSection = document.getElementById('loading-section');
        const statusText = document.getElementById('status-text');
        const counterLine = document.getElementById('counter-line');
        const retryBtn = document.getElementById('retry-btn');
        const resultsSection = document.getElementById('results-section');
        const statRow = document.getElementById('stat-row');
        const tabRecapBtn = document.getElementById('tab-recap-btn');
        const tabTimelineBtn = document.getElementById('tab-timeline-btn');
        const tabMindmapBtn = document.getElementById('tab-mindmap-btn');
        const resultTabIndicator = document.getElementById('result-tab-indicator');
        const recapPanel = document.getElementById('recap-panel');
        const timelinePanel = document.getElementById('timeline-panel');
        const mindmapPanel = document.getElementById('mindmap-panel');
        const mindmapCanvas = document.getElementById('mindmap-canvas');
        const mindmapSvg = document.getElementById('mindmap-svg');
        const graphEmptyNote = document.getElementById('graph-empty-note');
        const graphViewport = document.getElementById('graph-viewport');
        const sidePanel = document.getElementById('side-panel');
        const panelOverlay = document.getElementById('panel-overlay');
        const panelTitle = document.getElementById('panel-title');
        const panelBody = document.getElementById('panel-body');
        const panelCloseBtn = document.getElementById('panel-close');
        const copySummaryBtn = document.getElementById('copy-summary-btn');
        const modeTranscriptBtn = document.getElementById('mode-transcript-btn');
        const modeUploadBtn = document.getElementById('mode-upload-btn');
        const modeTranscriptPanel = document.getElementById('mode-transcript-panel');
        const modeUploadPanel = document.getElementById('mode-upload-panel');
        const dropzone = document.getElementById('dropzone');
        const dropzoneLabel = document.getElementById('dropzone-label');
        const mediaInput = document.getElementById('media-input');
        const analyzeBtnLabel = document.getElementById('analyze-btn-label');
        const speakerSection = document.getElementById('speaker-section');
        const speakerCount = document.getElementById('speaker-count');
        const speakerList = document.getElementById('speaker-list');
        const speakerContinueBtn = document.getElementById('speaker-continue-btn');

        let analysisData = null;
        let currentMode = 'transcript';
        let selectedFile = null;
        let transcribedData = null;
        let retryTarget = null;
        let previewMedia = null;
        let previewTimer = null;

        // ── Input validation ──
        transcript.addEventListener('input', () => {
            if (currentMode === 'transcript') {
                analyzeBtn.disabled = transcript.value.trim().length === 0;
            }
        });

        // ── Mode switch (transcript / upload) ──
        function setMode(mode) {
            currentMode = mode;
            const isUpload = mode === 'upload';
            modeUploadBtn.classList.toggle('active', isUpload);
            modeUploadBtn.setAttribute('aria-selected', String(isUpload));
            modeTranscriptBtn.classList.toggle('active', !isUpload);
            modeTranscriptBtn.setAttribute('aria-selected', String(!isUpload));
            modeUploadPanel.classList.toggle('hidden', !isUpload);
            modeTranscriptPanel.classList.toggle('hidden', isUpload);
            analyzeBtnLabel.textContent = isUpload ? 'Transcribe & detect speakers' : 'Analyze';
            analyzeBtn.disabled = isUpload
                ? !selectedFile
                : transcript.value.trim().length === 0;
        }

        modeTranscriptBtn.addEventListener('click', () => setMode('transcript'));
        modeUploadBtn.addEventListener('click', () => setMode('upload'));

        // ── Dropzone ──
        function setSelectedFile(file) {
            selectedFile = file || null;
            if (selectedFile) {
                dropzone.classList.add('has-file');
                dropzoneLabel.textContent = selectedFile.name;
            } else {
                dropzone.classList.remove('has-file');
                dropzoneLabel.textContent = 'Drop a file here, or click to browse';
            }
            analyzeBtn.disabled = currentMode === 'upload' && !selectedFile;
        }

        dropzone.addEventListener('click', () => mediaInput.click());
        mediaInput.addEventListener('change', () => {
            setSelectedFile(mediaInput.files && mediaInput.files[0]);
        });
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });
        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            const file = e.dataTransfer.files && e.dataTransfer.files[0];
            if (file) setSelectedFile(file);
        });

        // ── Loading animation ──
        const STATUS_LINES = [
            'Reading transcript\u2026',
            'Identifying speakers\u2026',
            'Extracting statements\u2026',
            'Finding decisions\u2026',
            'Checking for conflicts\u2026',
            'Detecting what wasn\u2019t decided\u2026',
            'Assessing risks\u2026',
            'Reconstructing meeting state\u2026',
        ];

        const TRANSCRIBE_STATUS_LINES = [
            'Uploading recording…',
            'Separating voices…',
            'Detecting speakers…',
            'Transcribing audio…',
        ];

        let statusIndex = 0, fakeCount = 0, statusInterval = null, counterInterval = null;
        let activeStatusLines = STATUS_LINES;
        let activeCounterLabel = 'statements parsed';

        function setStatusLine(text) {
            statusText.classList.remove('in');
            statusText.classList.add('out');
            setTimeout(() => {
                statusText.textContent = text;
                statusText.classList.remove('out');
                statusText.classList.add('in');
            }, 300);
        }

        function startLoadingAnimation(lines, counterLabel) {
            activeStatusLines = lines || STATUS_LINES;
            activeCounterLabel = counterLabel || 'statements parsed';
            statusIndex = 0; fakeCount = 0;
            statusText.textContent = activeStatusLines[0];
            statusText.classList.add('in');
            statusText.classList.remove('out');
            counterLine.textContent = '';

            statusInterval = setInterval(() => {
                statusIndex = (statusIndex + 1) % activeStatusLines.length;
                setStatusLine(activeStatusLines[statusIndex]);
            }, 800);

            counterInterval = setInterval(() => {
                fakeCount += Math.floor(Math.random() * 3) + 1;
                counterLine.textContent = fakeCount + ' ' + activeCounterLabel;
            }, 200);
        }

        function stopLoadingAnimation(stats) {
            clearInterval(statusInterval);
            clearInterval(counterInterval);
            statusInterval = null;
            counterInterval = null;
            if (stats) {
                setStatusLine('Analysis complete');
                const parts = [];
                if (stats.decisions)   parts.push(stats.decisions + ' decision' + (stats.decisions !== 1 ? 's' : ''));
                if (stats.commitments) parts.push(stats.commitments + ' commitment' + (stats.commitments !== 1 ? 's' : ''));
                if (stats.conflicts)   parts.push(stats.conflicts + ' conflict' + (stats.conflicts !== 1 ? 's' : ''));
                if (stats.gaps)        parts.push(stats.gaps + ' gap' + (stats.gaps !== 1 ? 's' : ''));
                counterLine.textContent = parts.join(' \u00b7 ') || 'No items found';
            }
        }

        // ── Status helpers ──
        const STATUS_COLORS = {
            DECIDED:   'var(--status-decided)',
            COMMITTED: 'var(--status-committed)',
            DISCUSSED: 'var(--status-discussed)',
            CONFLICT:  'var(--status-conflict)',
            UNKNOWN:   'var(--status-unknown)',
        };
        const STATUS_LABELS = {
            DECIDED: 'Decided', COMMITTED: 'Committed', DISCUSSED: 'Discussed',
            CONFLICT: 'Conflict', UNKNOWN: 'Unresolved',
        };

        function lowestEvidenceNum(item) {
            const nums = (item.evidence_ids || []).map(id => {
                const m = id.match(/\d+/);
                return m ? parseInt(m[0], 10) : Infinity;
            });
            return nums.length ? Math.min(...nums) : Infinity;
        }

        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str || '';
            return d.innerHTML;
        }

        // ── Render results ──
        function renderResults(data) {
            analysisData = data;
            const { events, analysis } = data;
            const { meeting_state, conflicts, gaps, risks, dependencies, summary_stats } = analysis;

            const eventMap = {};
            events.forEach(e => { eventMap[e.id] = e; });

            const sorted = [...meeting_state].sort((a, b) => lowestEvidenceNum(a) - lowestEvidenceNum(b));

            const conflictMap = {};
            conflicts.forEach(c => { conflictMap[c.topic] = c; });

            // ── Stat row ──
            const statItems = [
                { n: summary_stats.decisions,   label: 'decision',   color: STATUS_COLORS.DECIDED },
                { n: summary_stats.commitments, label: 'commitment', color: STATUS_COLORS.COMMITTED },
                { n: summary_stats.conflicts,   label: 'conflict',   color: STATUS_COLORS.CONFLICT },
                { n: summary_stats.gaps,        label: 'gap',        color: STATUS_COLORS.UNKNOWN },
            ];
            statRow.innerHTML = statItems.map((s) => {
                const pl = s.n !== 1 ? 's' : '';
                return '<span class="stat-item"><span class="stat-dot" style="background:' + s.color + ';color:' + s.color + '"></span><strong>' + s.n + '</strong> ' + s.label + pl + '</span>';
            }).join('');

            // ── Conflicts empty state ──
            if (!conflicts || conflicts.length === 0) {
                graphEmptyNote.innerHTML = CHECK_ICON + '<span>No conflicts detected — everyone’s aligned.</span>';
                graphEmptyNote.classList.remove('hidden');
            } else {
                graphEmptyNote.classList.add('hidden');
            }

            // ── Node cards ──
            const CARD_W = 184, CARD_GAP = 28, CARD_TOP = 16, CARD_H_EST = 112;
            graphViewport.innerHTML = '';
            const nodePositions = {};

            sorted.forEach((item, i) => {
                const x = i * (CARD_W + CARD_GAP);
                const y = CARD_TOP;
                const status = item.status || 'UNKNOWN';
                const color = STATUS_COLORS[status] || STATUS_COLORS.UNKNOWN;

                const card = document.createElement('div');
                card.className = 'node-card appear';
                card.style.animationDelay = (i * 50) + 'ms';
                card.setAttribute('data-status', status);
                card.setAttribute('data-topic', item.topic);
                card.setAttribute('tabindex', '0');
                card.setAttribute('role', 'button');
                card.setAttribute('aria-label', (STATUS_LABELS[status] || status) + ': ' + item.topic);
                card.style.left = x + 'px';
                card.style.top = y + 'px';

                const metaParts = [];
                if (item.owner) metaParts.push(item.owner);
                if (item.value && item.value !== item.topic) metaParts.push(item.value);
                if (item.deadline) metaParts.push('\u21e2 ' + item.deadline);
                const metaHtml = metaParts.length
                    ? '<div class="node-meta">' + esc(metaParts.join(' \u00b7 ')) + '</div>' : '';

                card.innerHTML =
                    '<div class="node-topic">' + esc(item.topic) + '</div>' +
                    '<div class="node-status" style="color:' + color + '">' +
                        '<span class="node-status-dot" style="background:' + color + '"></span>' +
                        (STATUS_LABELS[status] || status) +
                        (item.confidence === 'tentative' ? ' <span style="opacity:0.6">(tentative)</span>' : '') +
                    '</div>' + metaHtml;

                card.addEventListener('click', () => openPanel(item, eventMap, conflictMap));
                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        openPanel(item, eventMap, conflictMap);
                    }
                });
                graphViewport.appendChild(card);
                nodePositions[item.topic] = { x, y, w: CARD_W, h: CARD_H_EST };
            });

            const totalW = sorted.length * (CARD_W + CARD_GAP) - CARD_GAP;
            graphViewport.style.width = Math.max(totalW, 0) + 'px';
            graphViewport.style.minHeight = (CARD_TOP + CARD_H_EST + 40) + 'px';

            // ── Dependency connectors ──
            if (dependencies && dependencies.length > 0) {
                const svgNS = 'http://www.w3.org/2000/svg';
                const svg = document.createElementNS(svgNS, 'svg');
                svg.setAttribute('width', graphViewport.style.width);
                svg.setAttribute('height', graphViewport.style.minHeight);
                svg.style.width = graphViewport.style.width;
                svg.style.height = graphViewport.style.minHeight;

                dependencies.forEach(dep => {
                    const from = nodePositions[dep.from_topic];
                    const to = nodePositions[dep.to_topic];
                    if (!from || !to) return;

                    const x1 = from.x + from.w;
                    const y1 = from.y + from.h / 2;
                    const x2 = to.x;
                    const y2 = to.y + to.h / 2;
                    const cpOffset = Math.max(40, Math.abs(x2 - x1) * 0.35);

                    const path = document.createElementNS(svgNS, 'path');
                    path.setAttribute('d',
                        'M' + x1 + ',' + y1 + ' C' + (x1 + cpOffset) + ',' + y1 +
                        ' ' + (x2 - cpOffset) + ',' + y2 + ' ' + x2 + ',' + y2
                    );
                    path.classList.add('dep-line');

                    const title = document.createElementNS(svgNS, 'title');
                    title.textContent = dep.from_topic + ' \u2192 ' + dep.to_topic + ': ' + dep.reason;
                    path.appendChild(title);
                    svg.appendChild(path);
                });

                graphViewport.appendChild(svg);
            }

            // ── Insights sidebar ──
            renderSidebar(gaps, risks, nodePositions);

            // ── Action board ──
            renderActionBoard(meeting_state);

            // ── Recap tab — rendered from this same response, no re-fetch ──
            renderRecap(data.recap, meeting_state, eventMap);

            // ── Mindmap tab — rendered from this same response, no re-fetch ──
            renderMindmap(meeting_state, dependencies, eventMap, conflictMap);

            setResultTab('recap');
        }

        // ── Action board ──
        function ownerInitials(owner) {
            if (!owner) return '?';
            const parts = owner.trim().split(/\s+/).filter(Boolean);
            if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
            return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }

        const CLOCK_ICON = '<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.25"/><path d="M8 4.75V8l2.25 1.5"/></svg>';
        const CHECK_ICON = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5L6.5 12L13 4.5"/></svg>';

        function renderActionBoard(meetingState) {
            const board = document.getElementById('action-board');
            const committed = meetingState.filter(item => item.status === 'COMMITTED');

            if (!committed.length) {
                board.innerHTML =
                    '<div class="action-board-title">Action board</div>' +
                    '<div class="action-board-empty">No commitments captured.</div>';
                return;
            }

            let html = '<div class="action-board-title">Action board</div><div class="action-board-row">';
            committed.forEach(item => {
                const taskParts = [item.topic];
                if (item.value && item.value !== item.topic) taskParts.push(item.value);
                const task = taskParts.join(' — ');
                const owner = item.owner || 'Unassigned';

                const deadlineHtml = item.deadline
                    ? '<div class="action-deadline">' + CLOCK_ICON + esc(item.deadline) + '</div>'
                    : '<div class="action-deadline no-deadline">No confirmed deadline</div>';

                const isTentative = item.confidence === 'tentative';
                const confidenceHtml = '<span class="action-confidence ' +
                    (isTentative ? 'tentative' : 'firm') + '">' +
                    (isTentative ? 'Tentative' : 'Firm') + '</span>';

                html += '<div class="action-card">' +
                    '<div class="action-card-top">' +
                        '<div class="action-owner"><span class="action-owner-avatar">' + esc(ownerInitials(item.owner)) + '</span>' + esc(owner) + '</div>' +
                        confidenceHtml +
                    '</div>' +
                    '<div class="action-task">' + esc(task) + '</div>' +
                    deadlineHtml +
                    '</div>';
            });
            html += '</div>';

            board.innerHTML = html;
        }

        // ── Recap tab ──
        function renderRecap(recap, meetingState, eventMap) {
            if (!recap) {
                recapPanel.innerHTML = '<div class="recap-empty">This transcript is long enough ' +
                    'that recap generation is a planned feature — check the Timeline view for ' +
                    'full analysis.</div>';
                return;
            }

            const topicStatus = {};
            (meetingState || []).forEach(item => { topicStatus[item.topic] = item.status; });

            let html = '<p class="recap-overview">' + esc(recap.overview) + '</p>';
            html += '<ul class="recap-beats">';

            (recap.beats || []).forEach((beat, i) => {
                const status = beat.related_topic && topicStatus[beat.related_topic];
                const dotColor = (status && STATUS_COLORS[status]) || 'var(--border-hover)';
                const evidenceHtml = buildEvidenceHtml(beat.evidence_ids, eventMap);
                const chevronHtml = evidenceHtml
                    ? '<svg class="recap-beat-chevron" width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L11 8L6 12.5"/></svg>'
                    : '';

                html += '<li class="recap-beat" data-beat-index="' + i + '">' +
                    '<span class="recap-beat-dot" style="background:' + dotColor + '"></span>' +
                    '<div class="recap-beat-header">' +
                        '<span class="recap-beat-text">' + esc(beat.text) + '</span>' + chevronHtml +
                    '</div>';
                if (evidenceHtml) {
                    html += '<div class="recap-beat-evidence">' + evidenceHtml + '</div>';
                }
                html += '</li>';
            });

            html += '</ul>';
            recapPanel.innerHTML = html;

            recapPanel.querySelectorAll('.recap-beat').forEach(el => {
                if (!el.querySelector('.recap-beat-evidence')) return;
                el.addEventListener('click', () => el.classList.toggle('expanded'));
            });
        }

        // ── Mindmap tab ──
        function renderMindmap(meetingState, dependencies, eventMap, conflictMap) {
            const nodes = meetingState || [];
            const n = nodes.length;

            mindmapCanvas.querySelectorAll('.mindmap-node, .mindmap-center, .mindmap-empty').forEach(el => el.remove());

            if (n === 0) {
                const empty = document.createElement('div');
                empty.className = 'mindmap-empty';
                empty.style.cssText = 'position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:0.8125rem; color:var(--text-tertiary);';
                empty.textContent = 'No topics to map.';
                mindmapCanvas.appendChild(empty);
                mindmapSvg.innerHTML = '';
                return;
            }

            // Percentage-based coordinate system (0–100, matching the SVG
            // viewBox) so the whole layout scales with the container —
            // no JS resize recalculation needed.
            const cx = 50, cy = 50;
            const radius = Math.min(36, 20 + n * 2);
            const positions = {};

            nodes.forEach((item, i) => {
                const angle = (2 * Math.PI * i / n) - Math.PI / 2;
                positions[item.topic] = {
                    x: cx + radius * Math.cos(angle),
                    y: cy + radius * Math.sin(angle),
                };
            });

            let svg = '';
            nodes.forEach(item => {
                const p = positions[item.topic];
                svg += '<path class="mindmap-spoke" d="M' + cx + ',' + cy + ' L' + p.x + ',' + p.y + '"/>';
            });
            (dependencies || []).forEach(dep => {
                const from = positions[dep.from_topic];
                const to = positions[dep.to_topic];
                if (!from || !to) return;
                svg += '<path class="mindmap-dep-line" d="M' + from.x + ',' + from.y + ' L' + to.x + ',' + to.y + '">' +
                    '<title>' + esc(dep.from_topic + ' → ' + dep.to_topic + ': ' + dep.reason) + '</title></path>';
            });
            mindmapSvg.innerHTML = svg;

            const centerEl = document.createElement('div');
            centerEl.className = 'mindmap-center';
            centerEl.textContent = 'Meeting';
            mindmapCanvas.appendChild(centerEl);

            nodes.forEach(item => {
                const p = positions[item.topic];
                const status = item.status || 'UNKNOWN';
                const color = STATUS_COLORS[status] || STATUS_COLORS.UNKNOWN;

                const nodeEl = document.createElement('div');
                nodeEl.className = 'mindmap-node';
                nodeEl.setAttribute('data-status', status);
                nodeEl.setAttribute('tabindex', '0');
                nodeEl.setAttribute('role', 'button');
                nodeEl.setAttribute('aria-label', (STATUS_LABELS[status] || status) + ': ' + item.topic);
                nodeEl.style.left = p.x + '%';
                nodeEl.style.top = p.y + '%';
                nodeEl.innerHTML =
                    '<div class="mindmap-node-status-row" style="color:' + color + '">' +
                        '<span class="mindmap-node-dot" style="background:' + color + '"></span>' +
                        '<span>' + (STATUS_LABELS[status] || status) + '</span>' +
                    '</div>' +
                    '<div class="mindmap-node-topic">' + esc(item.topic) + '</div>';

                const activate = () => openPanel(item, eventMap, conflictMap);
                nodeEl.addEventListener('click', activate);
                nodeEl.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
                });
                mindmapCanvas.appendChild(nodeEl);
            });
        }

        // ── Result tabs (Recap / Timeline / Mindmap) — same fetched response, no re-fetch ──
        function setResultTab(tab) {
            const isTimeline = tab === 'timeline';
            const isMindmap = tab === 'mindmap';
            const isRecap = !isTimeline && !isMindmap;

            tabTimelineBtn.classList.toggle('active', isTimeline);
            tabTimelineBtn.setAttribute('aria-selected', String(isTimeline));
            tabMindmapBtn.classList.toggle('active', isMindmap);
            tabMindmapBtn.setAttribute('aria-selected', String(isMindmap));
            tabRecapBtn.classList.toggle('active', isRecap);
            tabRecapBtn.setAttribute('aria-selected', String(isRecap));

            timelinePanel.classList.toggle('hidden', !isTimeline);
            mindmapPanel.classList.toggle('hidden', !isMindmap);
            recapPanel.classList.toggle('hidden', !isRecap);

            const activeBtn = isTimeline ? tabTimelineBtn : (isMindmap ? tabMindmapBtn : tabRecapBtn);
            const trackWidth = resultTabIndicator.offsetWidth;
            const left = activeBtn.offsetLeft;
            const right = Math.max(0, trackWidth - left - activeBtn.offsetWidth);
            const radius = 'calc(var(--radius-md) - 3px)';
            resultTabIndicator.style.clipPath =
                'inset(0 ' + right + 'px 0 ' + left + 'px round ' + radius + ')';
        }

        tabRecapBtn.addEventListener('click', () => setResultTab('recap'));
        tabTimelineBtn.addEventListener('click', () => setResultTab('timeline'));
        tabMindmapBtn.addEventListener('click', () => setResultTab('mindmap'));
        window.addEventListener('resize', () => {
            if (resultsSection.classList.contains('hidden')) return;
            const isTimeline = tabTimelineBtn.classList.contains('active');
            const isMindmap = tabMindmapBtn.classList.contains('active');
            setResultTab(isTimeline ? 'timeline' : (isMindmap ? 'mindmap' : 'recap'));
        });

        function scrollToNode(topic) {
            const card = document.querySelector('.node-card[data-topic="' + CSS.escape(topic) + '"]');
            if (!card) return false;

            // Scroll the graph container so the card is visible
            const container = card.closest('.graph-container');
            if (container) {
                const cardLeft = parseInt(card.style.left, 10) || 0;
                container.scrollTo({ left: Math.max(0, cardLeft - 40), behavior: 'smooth' });
            }

            // Flash highlight
            card.classList.remove('flash');
            void card.offsetWidth; // force reflow
            card.classList.add('flash');
            return true;
        }

        function renderSidebar(gaps, risks, nodePositions) {
            const sidebar = document.getElementById('insights-sidebar');
            let html = '';

            // ── Gaps ──
            html += '<div class="insight-group">';
            html += '<div class="insight-group-title">What wasn\u2019t decided</div>';
            if (gaps && gaps.length > 0) {
                html += '<ul class="insight-list">';
                gaps.forEach(gap => {
                    const hasNode = !!nodePositions[gap.topic];
                    html += '<li class="insight-item" data-gap-topic="' + esc(gap.topic) + '" tabindex="0" role="button">';
                    html += '<div class="insight-item-header">';
                    html += '<span class="insight-dot" style="background:var(--status-unknown)"></span>';
                    html += '<span class="insight-topic">' + esc(gap.topic) + '</span>';
                    html += '</div>';
                    html += '<div class="insight-desc">' + esc(gap.why_it_matters) + '</div>';
                    if (!hasNode) {
                        html += '<div class="insight-no-match">No related node \u2014 this was never actually addressed.</div>';
                    }
                    html += '</li>';
                });
                html += '</ul>';
            } else {
                html += '<div class="insight-empty">' + CHECK_ICON + '<span>Nothing left hanging \u2014 every topic reached a resolution.</span></div>';
            }
            html += '</div>';

            // ── Risks ──
            html += '<div class="insight-group">';
            html += '<div class="insight-group-title">What could go wrong</div>';
            if (risks && risks.length > 0) {
                html += '<ul class="insight-list">';
                risks.forEach(risk => {
                    html += '<li class="insight-item risk-item">';
                    html += '<div class="risk-header">' +
                        '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5L15 14H1L8 1.5Z"/><path d="M8 6.25V9.25"/><circle cx="8" cy="11.5" r="0.6" fill="currentColor" stroke="none"/></svg>' +
                        '<span>Risk</span></div>';
                    html += '<div class="risk-statement">' + esc(risk.statement) + '</div>';
                    html += '<div class="risk-reason">' + esc(risk.reason) + '</div>';
                    html += '<div class="risk-followup">' +
                        '<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 5.75a2.5 2.5 0 1 1 3.5 2.29c-.7.32-1 .8-1 1.46v.3"/><circle cx="8" cy="12.25" r="0.6" fill="currentColor" stroke="none"/></svg>' +
                        '<span>' + esc(risk.suggested_followup_question) + '</span></div>';
                    html += '</li>';
                });
                html += '</ul>';
            } else {
                html += '<div class="insight-empty">' + CHECK_ICON + '<span>No risks flagged for this meeting.</span></div>';
            }
            html += '</div>';

            sidebar.innerHTML = html;

            // Wire gap click handlers
            sidebar.querySelectorAll('[data-gap-topic]').forEach(el => {
                const activate = () => scrollToNode(el.getAttribute('data-gap-topic'));
                el.addEventListener('click', activate);
                el.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
                });
            });
        }

        // ── Side panel ──
        // Shared evidence-lookup-by-id rendering — used by the Timeline side
        // panel and the Recap tab's beat expansion, so there is exactly one
        // evidence display mechanism in the app, not two.
        function buildEvidenceHtml(evidenceIds, eventMap) {
            let html = '';
            (evidenceIds || []).forEach(eid => {
                const ev = eventMap[eid];
                if (!ev) return;
                html += '<div class="evidence-block">' +
                    '<span class="evidence-id">' + esc(ev.id) + '</span>' +
                    '<span class="evidence-speaker">' + esc(ev.speaker) + ':</span> ' +
                    esc(ev.text) + '</div>';
            });
            return html;
        }

        function openPanel(item, eventMap, conflictMap) {
            document.querySelectorAll('.node-card.active').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.node-card').forEach(c => {
                if (c.querySelector('.node-topic')?.textContent === item.topic) c.classList.add('active');
            });

            const status = item.status || 'UNKNOWN';
            const color = STATUS_COLORS[status] || STATUS_COLORS.UNKNOWN;

            panelTitle.innerHTML =
                '<span class="node-status" style="color:' + color + ';margin-bottom:0.25rem">' +
                    '<span class="node-status-dot" style="background:' + color + '"></span>' +
                    (STATUS_LABELS[status] || status) +
                '</span><br>' + esc(item.topic);

            let bodyHtml = '';

            // Meta
            const meta = [];
            if (item.owner)      meta.push('<strong>Owner:</strong> ' + esc(item.owner));
            if (item.value)      meta.push('<strong>Value:</strong> ' + esc(item.value));
            if (item.deadline)   meta.push('<strong>Deadline:</strong> ' + esc(item.deadline));
            if (item.confidence) meta.push('<strong>Confidence:</strong> ' + esc(item.confidence));
            if (meta.length) {
                bodyHtml += '<div class="panel-section"><div class="panel-meta-row">' +
                    meta.map(p => '<span class="panel-meta-item">' + p + '</span>').join('') +
                    '</div></div>';
            }

            // Reasoning
            if (item.reasoning) {
                bodyHtml += '<div class="panel-section">' +
                    '<div class="panel-section-label">Reasoning</div>' +
                    '<div class="panel-reasoning">' + esc(item.reasoning) + '</div>' +
                    '</div>';
            }

            // Conflict comparison
            const conflict = conflictMap[item.topic];
            if (conflict) {
                bodyHtml += '<div class="panel-section">' +
