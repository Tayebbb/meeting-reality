                    '<div class="panel-section-label">Conflict</div>' +
                    '<div class="conflict-compare">' +
                        '<div class="conflict-side">' +
                            '<div class="conflict-side-label">Position A</div>' +
                            '<div class="conflict-side-text">' + esc(conflict.statement_a.text) + '</div>' +
                        '</div>' +
                        '<div class="conflict-side">' +
                            '<div class="conflict-side-label">Position B</div>' +
                            '<div class="conflict-side-text">' + esc(conflict.statement_b.text) + '</div>' +
                        '</div>' +
                    '</div></div>';
            }

            // Evidence
            if (item.evidence_ids && item.evidence_ids.length) {
                const evidenceHtml = buildEvidenceHtml(item.evidence_ids, eventMap);
                if (evidenceHtml) {
                    bodyHtml += '<div class="panel-section"><div class="panel-section-label">Evidence</div>' +
                        evidenceHtml + '</div>';
                }
            }

            panelBody.innerHTML = bodyHtml;
            sidePanel.classList.add('open');
            panelOverlay.classList.add('open');
        }

        function closePanel() {
            sidePanel.classList.remove('open');
            panelOverlay.classList.remove('open');
            document.querySelectorAll('.node-card.active').forEach(c => c.classList.remove('active'));
        }

        panelCloseBtn.addEventListener('click', closePanel);
        panelOverlay.addEventListener('click', closePanel);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanel(); });

        // ── Copy summary ──
        function buildSummaryText(meetingState) {
            const lines = meetingState.map(item => {
                const parts = [(STATUS_LABELS[item.status] || item.status) + ':', item.topic];
                if (item.value) parts.push('— ' + item.value);
                if (item.owner) parts.push('(' + item.owner + ')');
                if (item.deadline) parts.push('due ' + item.deadline);
                return parts.join(' ');
            });
            return lines.join('\n');
        }

        copySummaryBtn.addEventListener('click', async () => {
            if (!analysisData) return;
            const text = buildSummaryText(analysisData.analysis.meeting_state);
            try {
                await navigator.clipboard.writeText(text);
                const original = copySummaryBtn.textContent;
                copySummaryBtn.textContent = 'Copied!';
                setTimeout(() => { copySummaryBtn.textContent = original; }, 1500);
            } catch (err) {
                copySummaryBtn.textContent = 'Copy failed';
                setTimeout(() => { copySummaryBtn.textContent = 'Copy summary'; }, 1500);
            }
        });

        // ── Shared section helpers ──
        function hideAllSections() {
            inputSection.classList.add('hidden');
            speakerSection.classList.add('hidden');
            resultsSection.classList.add('hidden');
            loadingSection.classList.add('hidden');
        }

        function showError(message, target) {
            stopLoadingAnimation(null);
            setStatusLine('Something went wrong');
            counterLine.textContent = message;
            retryBtn.classList.remove('hidden');
            retryTarget = target;
        }

        retryBtn.addEventListener('click', () => {
            hideAllSections();
            retryBtn.classList.add('hidden');
            (retryTarget || inputSection).classList.remove('hidden');
            if (retryTarget === inputSection) transcript.focus();
        });

        // ── Analyze flow (transcript mode) ──
        async function startAnalysis() {
            if (analyzeBtn.disabled) return;
            hideAllSections();
            loadingSection.classList.remove('hidden');
            retryBtn.classList.add('hidden');
            startLoadingAnimation(STATUS_LINES, 'statements parsed');

            const body = { transcript: transcript.value };
            if (titleInput.value.trim())        body.title = titleInput.value.trim();
            if (participantsInput.value.trim()) body.participants = participantsInput.value.trim();

            try {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || 'Request failed (' + res.status + ')');
                }

                const data = await res.json();
                stopLoadingAnimation(data.analysis?.summary_stats);

                setTimeout(() => {
                    loadingSection.classList.add('hidden');
                    resultsSection.classList.remove('hidden');
                    renderResults(data);
                }, 600);

            } catch (err) {
                showError(err.message, inputSection);
            }
        }

        // ── Transcribe flow (upload mode) ──
        async function startTranscription() {
            if (analyzeBtn.disabled || !selectedFile) return;
            hideAllSections();
            loadingSection.classList.remove('hidden');
            retryBtn.classList.add('hidden');
            startLoadingAnimation(TRANSCRIBE_STATUS_LINES, 'seconds of audio processed');

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const res = await fetch('/api/transcribe', {
                    method: 'POST',
                    body: formData,
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || 'Request failed (' + res.status + ')');
                }

                transcribedData = await res.json();
                stopLoadingAnimation(null);
                setStatusLine('Speakers detected');

                setTimeout(() => {
                    loadingSection.classList.add('hidden');
                    renderSpeakerList(transcribedData);
                    speakerSection.classList.remove('hidden');
                }, 400);

            } catch (err) {
                showError(err.message, inputSection);
            }
        }

        // ── Speaker naming ──
        function formatTimestamp(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const m = Math.floor(totalSeconds / 60);
            const s = totalSeconds % 60;
            return m + ':' + String(s).padStart(2, '0');
        }

        function renderSpeakerList(data) {
            speakerCount.textContent = data.speakers.length;
            speakerList.innerHTML = '';

            data.speakers.forEach((speaker) => {
                const firstEvent = data.events.find((e) => e.speaker === speaker);

                const row = document.createElement('div');
                row.className = 'speaker-item';

                const playBtn = document.createElement('button');
                playBtn.type = 'button';
                playBtn.className = 'speaker-play-btn';
                playBtn.setAttribute('aria-label', 'Play sample of ' + speaker);
                playBtn.innerHTML =
                    '<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l10-5.5-10-5.5z"/></svg>';
                if (firstEvent) {
                    playBtn.addEventListener('click', () =>
                        playPreview(firstEvent.start_ms, firstEvent.end_ms, playBtn)
                    );
                } else {
                    playBtn.disabled = true;
                }

                const original = document.createElement('span');
                original.className = 'speaker-original-label';
                original.textContent = firstEvent ? formatTimestamp(firstEvent.start_ms) : speaker;

                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'speaker-name-input';
                input.value = speaker;
                input.dataset.originalSpeaker = speaker;
                input.setAttribute('aria-label', 'Name for ' + speaker);

                row.appendChild(playBtn);
                row.appendChild(original);
                row.appendChild(input);
                speakerList.appendChild(row);
            });
        }

        function playPreview(startMs, endMs, btn) {
            if (!selectedFile) return;

            document.querySelectorAll('.speaker-play-btn.playing').forEach((b) => {
                b.classList.remove('playing');
            });
            clearTimeout(previewTimer);

            if (!previewMedia) {
                previewMedia = document.createElement(
                    selectedFile.type.startsWith('video') ? 'video' : 'audio'
                );
                previewMedia.style.display = 'none';
                document.body.appendChild(previewMedia);
            }
            if (previewMedia.dataset.fileName !== selectedFile.name) {
                previewMedia.src = URL.createObjectURL(selectedFile);
                previewMedia.dataset.fileName = selectedFile.name;
            }

            previewMedia.currentTime = startMs / 1000;
            previewMedia.play();
            btn.classList.add('playing');

            const clipMs = Math.min(endMs - startMs, 6000);
            previewTimer = setTimeout(() => {
                previewMedia.pause();
                btn.classList.remove('playing');
            }, clipMs);
        }

        speakerContinueBtn.addEventListener('click', async () => {
            if (!transcribedData) return;

            const nameMap = {};
            speakerList.querySelectorAll('.speaker-name-input').forEach((input) => {
                const original = input.dataset.originalSpeaker;
                const value = input.value.trim();
                nameMap[original] = value || original;
            });

            const events = transcribedData.events.map((e) => ({
                id: e.id,
                speaker: nameMap[e.speaker] || e.speaker,
                text: e.text,
            }));

            hideAllSections();
            loadingSection.classList.remove('hidden');
            retryBtn.classList.add('hidden');
            startLoadingAnimation(STATUS_LINES, 'statements parsed');

            const body = { events };
            if (titleInput.value.trim())        body.title = titleInput.value.trim();
            if (participantsInput.value.trim()) body.participants = participantsInput.value.trim();

            try {
                const res = await fetch('/api/analyze-events', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || 'Request failed (' + res.status + ')');
                }

                const data = await res.json();
                stopLoadingAnimation(data.analysis?.summary_stats);

                setTimeout(() => {
                    loadingSection.classList.add('hidden');
                    resultsSection.classList.remove('hidden');
                    renderResults(data);
                }, 600);

            } catch (err) {
                showError(err.message, speakerSection);
            }
        });

        analyzeBtn.addEventListener('click', () => {
            if (currentMode === 'upload') {
                startTranscription();
            } else {
                startAnalysis();
            }
        });

        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                e.preventDefault();
                if (currentMode === 'upload') {
                    startTranscription();
                } else {
                    startAnalysis();
                }
            }
        });

        if (!/Mac|iPhone|iPad/.test(navigator.platform || '')) {
            const kbdHint = document.querySelector('.kbd-hint');
            if (kbdHint) kbdHint.textContent = 'Ctrl \u21b5';
        }
    </script>
</body>
</html>
